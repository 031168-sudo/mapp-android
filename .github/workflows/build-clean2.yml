name: Build clean APK 2
on:
  push:
    branches: [ build-clean-from-working-apk ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source
        run: unzip -q mapp-project.zip
      - name: Patch working source
        run: python3 patch_working.py
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Verify
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Export APK
        run: |
          mkdir -p build-export
          base64 -w0 app/build/outputs/apk/debug/app-debug.apk > build-export/app-debug.apk.b64
          printf '\n' >> build-export/app-debug.apk.b64
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build-export/SHA256.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add build-export
          git commit -m "Export verified clean APK" || true
          git push
