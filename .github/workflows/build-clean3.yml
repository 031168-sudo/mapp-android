name: Build clean APK 3
on:
  push:
    branches: [ build-clean-from-working-apk ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source
        run: unzip -q mapp-project.zip
      - name: Restore working logic
        run: python3 patch_working.py
      - name: Remove only visible service information
        run: python3 remove_diag_visual.py
      - name: Validate JavaScript
        run: node --check app/src/main/assets/code.js
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-clean-final-v8
          path: app/build/outputs/apk/debug/app-debug.apk
