name: Build Minew S1 APK
on:
  push:
    branches: ['minew-s1']
    paths: ['minew-s1/**', '.github/workflows/build-minew-s1.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply UI patch
        working-directory: minew-s1
        run: python3 apply_ui_patch.py
      - name: Fix history panels
        working-directory: minew-s1
        run: python3 fix_history_panels.py
      - name: Build debug APK
        working-directory: minew-s1
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Minew-S1-debug-apk
          path: minew-s1/app/build/outputs/apk/debug/*.apk
