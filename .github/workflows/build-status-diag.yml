name: Build Status Diagnostics
on:
  push:
    paths:
      - 'patch_status_native.py'
      - 'trigger_status_diag.txt'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: rm -rf project && mkdir project && unzip -q mapp-project.zip -d project
      - name: Apply diagnostics
        run: python3 patch_status_native.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-status-diagnostics
          path: project/app/build/outputs/apk/debug/*.apk
